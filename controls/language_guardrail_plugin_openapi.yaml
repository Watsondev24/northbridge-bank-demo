openapi: 3.0.3
info:
  title: Language Sensitivity Guardrail Plugin
  version: 1.0.0
servers:
  - url: https://YOUR_GUARDRAIL_HOST.example.com
paths:
  /agent_pre_invoke:
    post:
      operationId: language_guardrail_pre
      description: Detects the word silly and asks the agent to warn gently without blocking.
      x-ibm-orchestrate-plugin:
        hook: agent_pre_invoke
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payload, context]
              properties:
                payload:
                  type: object
                  additionalProperties: true
                context:
                  type: object
                  additionalProperties: true
      responses:
        '200':
          description: Continue processing, optionally with modified message.
          content:
            application/json:
              schema:
                type: object
                required: [continue_processing]
                properties:
                  continue_processing:
                    type: boolean
                  modified_payload:
                    type: object
                    additionalProperties: true
