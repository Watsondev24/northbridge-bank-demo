openapi: 3.0.3
info:
  title: Language Guardrail Post Invoke v3
  version: 3.0.0
servers:
  - url: https://YOUR_GUARDRAIL_HOST.example.com
paths:
  /agent_post_invoke:
    post:
      operationId: language_guardrail_post_v3
      description: Adds an explicit warning to the final agent response after the
        first violation.
      x-ibm-orchestrate-plugin:
        hook: agent_post_invoke
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - payload
              - context
              properties:
                payload:
                  type: object
                  additionalProperties: true
                context:
                  type: object
                  additionalProperties: true
      responses:
        '200':
          description: Post-invoke decision
          content:
            application/json:
              schema:
                type: object
                required:
                - continue_processing
                properties:
                  continue_processing:
                    type: boolean
                  modified_payload:
                    type: object
                    additionalProperties: true
